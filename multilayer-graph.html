<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多元课程图谱 | 汕头大学《基础编程》</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="multilayer-graph-data.js"></script>
  <style>
    .subpage-hero { padding: 120px 20px 32px; text-align: center; }
    .subpage-hero h1 { font-size: 2.2rem; margin-bottom: 14px; }
    .ml-shell { max-width: 1400px; margin: 0 auto; padding: 0 20px 80px; }
    .ml-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
    .ml-tab {
      border: 1px solid var(--border2); background: transparent; color: var(--text2);
      border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .ml-tab:hover { border-color: var(--emerald); color: var(--text); }
    .ml-tab.active { color: #fff; border-color: transparent; background: var(--grad-accent); }
    .ml-layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; }
    @media (max-width: 980px) { .ml-layout { grid-template-columns: 1fr; } }
    .ml-stage { height: 640px; border: 1px solid var(--border); border-radius: 22px;
      background: rgba(15,25,35,0.7); backdrop-filter: blur(14px); box-shadow: var(--card-shadow);
      overflow: hidden; }
    [data-theme="light"] .ml-stage { background: rgba(255,255,255,0.88); }
    .ml-panel { border: 1px solid var(--border); border-radius: 22px; padding: 24px;
      background: rgba(15,25,35,0.7); backdrop-filter: blur(14px); box-shadow: var(--card-shadow);
      max-height: 640px; overflow-y: auto; }
    [data-theme="light"] .ml-panel { background: rgba(255,255,255,0.88); }
    .ml-kicker { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.05em; color: var(--text2);
      text-transform: uppercase; margin-bottom: 8px; }
    .ml-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 10px; color: var(--text); }
    .ml-desc { color: var(--text2); line-height: 1.7; font-size: 0.95rem; }
    .ml-section { margin-top: 18px; }
    .ml-section h3 { font-size: 0.88rem; font-weight: 700; color: var(--text); margin-bottom: 8px;
      letter-spacing: 0.02em; }
    .ml-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .ml-tag { padding: 4px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 600;
      background: rgba(16,185,129,0.12); color: var(--emerald); border: 1px solid rgba(16,185,129,0.24); }
    .ml-tag.kp { background: rgba(14,165,233,0.12); color: #0ea5e9; border-color: rgba(14,165,233,0.24); }
    .ml-tag.lvl-basic { background: rgba(139,92,246,0.12); color: #8b5cf6; border-color: rgba(139,92,246,0.24); }
    .ml-tag.lvl-adv { background: rgba(245,158,11,0.12); color: #f59e0b; border-color: rgba(245,158,11,0.24); }
    .ml-tag.lvl-cha { background: rgba(239,68,68,0.12); color: #ef4444; border-color: rgba(239,68,68,0.24); }
    .ml-back { display: inline-block; margin: 24px 0; color: var(--text2); text-decoration: none;
      font-weight: 600; }
    .ml-back:hover { color: var(--emerald); }
    .ml-legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 16px; color: var(--text2); font-size: 0.85rem; }
    .ml-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .ml-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .ml-teacher { margin-top: 16px; border: 1px dashed var(--border2); border-radius: 14px; padding: 10px 14px; }
    .ml-teacher summary { cursor: pointer; font-weight: 700; color: var(--text); }
    .ml-teacher p { margin-top: 8px; }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar" role="navigation" aria-label="主导航">
    <div class="nav-inner">
      <div class="nav-brand"><a href="index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px"><div class="nav-logo" aria-hidden="true">🐍</div><span>基础编程</span></a></div>
      <button class="hamburger" id="hamburger" aria-label="切换导航菜单" aria-expanded="false" aria-controls="nav-links">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="nav-links">
        <a href="index.html">← 返回主页</a>
        <a href="knowledge-graph.html">知识图谱</a>
        <a href="multilayer-graph.html" class="active">多元图谱</a>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题"><div class="theme-toggle-knob" id="themeIcon">🌙</div></button>
      </div>
    </div>
  </nav>

  <header class="subpage-hero">
    <h1>多元课程图谱</h1>
    <p style="color:var(--text2);max-width:720px;margin:0 auto;line-height:1.7">
      这门课里你会碰到哪些能力、哪些问题、哪些价值取舍，都画在这几张图里了。
      点开一个节点，能看到它和哪些知识点相关、课上练什么。
      知识图谱（具体的 Python 概念）在<a href="knowledge-graph.html" style="color:var(--emerald)">另一页</a>。
    </p>
  </header>

  <main class="ml-shell">
    <div class="ml-tabs">
      <button class="ml-tab active" data-graph="ability">能力图谱</button>
      <button class="ml-tab" data-graph="problem">问题图谱</button>
      <button class="ml-tab" data-graph="ideology">思政图谱</button>
    </div>
    <p class="ml-legend" id="graphLegend"></p>
    <div class="ml-layout">
      <div class="ml-stage" id="graphStage"></div>
      <aside class="ml-panel" id="detailPanel">
        <div class="ml-kicker">多元图谱</div>
        <h2 class="ml-title">点击节点查看详情</h2>
        <p class="ml-desc">选择上方任一图谱，点击图中节点可查看能力点训练任务、问题参考解答或思政育人路径。</p>
      </aside>
    </div>
    <a class="ml-back" href="knowledge-graph.html">← 返回知识图谱</a>
  </main>

  <script src="nav.js"></script>
  <script>
    (() => {
      'use strict';
      const G = window.MULTILAYER_GRAPH || {};
      const stage = document.getElementById('graphStage');
      const panel = document.getElementById('detailPanel');
      const legend = document.getElementById('graphLegend');
      const chart = echarts.init(stage);
      let current = 'ability';
      let selected = null;

      const KP_INDEX = new Map();
      (G.knowledge_extension && G.knowledge_extension.nodes || []).forEach(n => {
        KP_INDEX.set(n.node_id || n.id, n);
      });
      const ABILITY_INDEX = new Map();
      (G.ability && G.ability.nodes || []).forEach(n => ABILITY_INDEX.set(n.id, n));

      const PROBLEM_COLOR = { '基本': '#0ea5e9', '组合': '#f59e0b', '复杂': '#ef4444' };
      const ABILITY_COLOR = { '基础': '#8b5cf6', '进阶': '#6366f1', '挑战': '#ec4899' };
      const GRAPH_COLOR = { ability: '#8b5cf6', problem: '#0ea5e9', ideology: '#10b981' };

      function escapeHtml(s) {
        return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function kpName(id) {
        const n = KP_INDEX.get(id);
        return n ? (n.name || n.title || id) : id;
      }

      function abilityName(id) {
        const n = ABILITY_INDEX.get(id);
        return n ? n.name : id;
      }

      function nodeId(n) {
        return n.id || n.node_id;
      }

      function problemLabel(n, index) {
        const match = String(n.id || '').match(/p-(basic|combo|complex)-(\d+)/);
        if (match) return `${n.level || ''}${Number(match[2])}`;
        return n.level ? `${n.level}${index + 1}` : `题${index + 1}`;
      }

      function problemTitle(n) {
        const title = n.title || '';
        if (title && !title.endsWith('引') && title.length < 36) return title;
        const ctx = n.context || title;
        const cut = ctx.split(/[。，]/)[0];
        return cut.length > 42 ? cut.slice(0, 40) + '…' : cut;
      }

      function isLightTheme() {
        return document.documentElement.getAttribute('data-theme') === 'light';
      }

      function buildNodes(graph) {
        const data = G[graph];
        if (!data) return { nodes: [], links: [] };
        const rawNodes = data.nodes || [];
        const idSet = new Set(rawNodes.map(nodeId));
        const nodes = rawNodes.map((n, i) => {
          const id = nodeId(n);
          const color = graph === 'problem'
            ? (PROBLEM_COLOR[n.level] || GRAPH_COLOR.problem)
            : graph === 'ability'
              ? (ABILITY_COLOR[n.level] || GRAPH_COLOR.ability)
              : GRAPH_COLOR.ideology;
          return {
            id,
            name: graph === 'problem' ? problemLabel(n, i) : (n.name || n.title || id),
            raw: n,
            symbolSize: graph === 'problem' ? (n.level === '复杂' ? 54 : n.level === '组合' ? 46 : 40) : 52,
            itemStyle: { color, borderColor: isLightTheme() ? '#fff' : '#0f1923', borderWidth: 2 },
            category: n.level || graph
          };
        });
        const links = (data.links || []).filter(l => idSet.has(l.source) && idSet.has(l.target)).map(l => ({
          source: l.source,
          target: l.target,
          raw: l,
          lineStyle: { color: GRAPH_COLOR[graph], width: 2, curveness: 0.12, opacity: 0.55 }
        }));
        return { nodes, links, dropped: (data.links || []).length - links.length };
      }

      function legendFor(graph, dropped) {
        if (graph === 'problem') {
          legend.innerHTML = '<span><i class="ml-dot" style="background:#0ea5e9"></i>基本</span><span><i class="ml-dot" style="background:#f59e0b"></i>组合</span><span><i class="ml-dot" style="background:#ef4444"></i>复杂</span><span>节点上的「基本1」对应右侧题目，点开看完整情境。</span>';
        } else if (graph === 'ability') {
          legend.innerHTML = `<span><i class="ml-dot" style="background:#8b5cf6"></i>基础</span><span><i class="ml-dot" style="background:#6366f1"></i>进阶</span><span><i class="ml-dot" style="background:#ec4899"></i>挑战</span><span>图上只画能力之间的进阶关系；支撑它的知识点在右侧详情里。</span>`;
        } else {
          legend.innerHTML = '<span><i class="ml-dot" style="background:#10b981"></i>思政点</span><span>关联的 Python 概念在点开节点后显示，不会在图上堆成一串内部编号。</span>';
        }
        if (dropped) legend.innerHTML += '';
      }

      function chartOption(nodes, links) {
        const light = isLightTheme();
        return {
          backgroundColor: 'transparent',
          tooltip: {
            confine: true,
            formatter(p) {
              if (p.dataType === 'edge' && p.data.raw) {
                return escapeHtml(p.data.raw.relation || '关联') +
                  (p.data.raw.detail ? '<br>' + escapeHtml(p.data.raw.detail) : '');
              }
              if (p.data && p.data.raw) {
                const n = p.data.raw;
                const title = current === 'problem' ? problemTitle(n) : (n.name || n.title || '');
                const level = n.level ? `层级：${n.level}` : '';
                return `<b>${escapeHtml(title)}</b>${level ? '<br>' + escapeHtml(level) : ''}`;
              }
              return p.name;
            }
          },
          series: [{
            type: 'graph',
            layout: 'force',
            roam: true,
            draggable: true,
            data: nodes,
            links,
            label: {
              show: true,
              position: 'bottom',
              distance: 6,
              fontSize: 12,
              fontWeight: 700,
              color: light ? '#1a2332' : '#e0eaf0',
              textBorderColor: light ? 'rgba(255,255,255,0.92)' : 'rgba(6,13,18,0.85)',
              textBorderWidth: 3
            },
            labelLayout: { hideOverlap: true },
            center: ['50%', '50%'],
            force: {
              edgeLength: current === 'problem' ? 100 : 160,
              repulsion: current === 'problem' ? 300 : 900,
              gravity: current === 'problem' ? 0.28 : 0.08,
              friction: 0.68
            },
            scaleLimit: { min: 0.5, max: 2.2 },
            edgeSymbol: ['none', 'arrow'],
            edgeSymbolSize: [0, 8],
            emphasis: { focus: 'adjacency', scale: true, label: { fontSize: 13 } }
          }]
        };
      }

      function render() {
        const built = buildNodes(current);
        legendFor(current, built.dropped);
        chart.setOption(chartOption(built.nodes, built.links), true);
        if (selected && built.nodes.some(n => n.id === selected.id)) {
          renderNode(selected);
        } else {
          selected = null;
          renderDefault(built);
        }
      }

      function renderDefault(built) {
        const data = G[current];
        if (!data) {
          panel.innerHTML = '<p class="ml-desc">这张图谱的数据没有加载到。</p>';
          return;
        }
        const desc = (data.description || '').split('。')[0];
        const shown = built ? built.links.length : 0;
        const total = (data.links || []).length;
        const stats = `${(data.nodes || []).length} 个节点 · 图上 ${shown} 条关系`;
        panel.innerHTML = `
          <div class="ml-kicker">${current === 'ability' ? '能力图谱' : current === 'problem' ? '问题图谱' : '思政图谱'}</div>
          <h2 class="ml-title">${escapeHtml(desc)}</h2>
          <p class="ml-desc">${escapeHtml(data.coverage_note || '')}</p>
          <div class="ml-section"><h3>规模</h3><div class="ml-tags"><span class="ml-tag">${escapeHtml(stats)}</span></div></div>
          <div class="ml-section"><h3>怎么看</h3><p class="ml-desc">点图里的节点看详情。知识点编号已经翻译成名称；课堂练习的参考思路默认收起，避免一眼看到答案。</p></div>`;
      }

      function kpTags(ids) {
        if (!ids || !ids.length) return '<p class="ml-desc">未标注。</p>';
        return `<div class="ml-tags">${ids.map(id => {
          const n = KP_INDEX.get(id);
          const href = n ? `knowledge-graph.html` : '';
          const label = escapeHtml(kpName(id));
          return href
            ? `<a class="ml-tag kp" href="${href}" style="text-decoration:none">${label}</a>`
            : `<span class="ml-tag kp">${label}</span>`;
        }).join('')}</div>`;
      }

      function teacherBlock(answer) {
        if (!answer || (Array.isArray(answer) && !answer.length)) return '';
        const body = Array.isArray(answer)
          ? answer.map(item => `<p class="ml-desc">${escapeHtml(item)}</p>`).join('')
          : `<p class="ml-desc">${escapeHtml(answer)}</p>`;
        return `<details class="ml-teacher"><summary>教师参考思路（先自己做）</summary>${body}</details>`;
      }

      function renderNode(node) {
        const n = node.raw;
        if (current === 'ability') {
          panel.innerHTML = `
            <div class="ml-kicker">能力点 · ${escapeHtml(n.level || '')}</div>
            <h2 class="ml-title">${escapeHtml(n.name)}</h2>
            <div class="ml-tags" style="margin-bottom:12px">
              <span class="ml-tag lvl-${n.level === '基础' ? 'basic' : n.level === '进阶' ? 'adv' : 'cha'}">${escapeHtml(n.level || '')}</span>
              ${n.weeks ? `<span class="ml-tag">${escapeHtml(n.weeks)}</span>` : ''}
            </div>
            <div class="ml-section"><h3>支撑知识点</h3>${kpTags(n.supported_kp_ids)}</div>
            <div class="ml-section"><h3>训练任务</h3><p class="ml-desc">${escapeHtml(n.training_task || '')}</p></div>
            <div class="ml-section"><h3>怎么算学会了</h3><p class="ml-desc">${escapeHtml(n.assessment_method || '')}</p></div>
            <div class="ml-section"><h3>对应学习目标</h3><p class="ml-desc">${escapeHtml(n.target_ilo || '')}</p></div>`;
        } else if (current === 'problem') {
          panel.innerHTML = `
            <div class="ml-kicker">课堂问题 · ${escapeHtml(n.level || '')}</div>
            <h2 class="ml-title">${escapeHtml(problemTitle(n))}</h2>
            <div class="ml-tags" style="margin-bottom:12px">
              <span class="ml-tag lvl-${n.level === '基本' ? 'basic' : n.level === '组合' ? 'adv' : 'cha'}">${escapeHtml(n.level || '')}</span>
              ${n.target_ability ? `<span class="ml-tag">${escapeHtml(abilityName(n.target_ability))}</span>` : ''}
            </div>
            <div class="ml-section"><h3>情境</h3><p class="ml-desc">${escapeHtml(n.context || '')}</p></div>
            <div class="ml-section"><h3>涉及知识点</h3>${kpTags(n.related_kp_ids)}</div>
            ${teacherBlock(n.teacher_answer)}`;
        } else {
          panel.innerHTML = `
            <div class="ml-kicker">思政点</div>
            <h2 class="ml-title">${escapeHtml(n.title || n.name || '')}</h2>
            <div class="ml-section"><h3>关联知识点</h3>${kpTags(n.related_kp_ids)}</div>
            <div class="ml-section"><h3>关联案例</h3><p class="ml-desc">${escapeHtml(n.case || '')}</p></div>
            <div class="ml-section"><h3>价值塑造目标</h3><p class="ml-desc">${escapeHtml(n.value_goal || '')}</p></div>
            <div class="ml-section"><h3>育人路径</h3><p class="ml-desc">${escapeHtml(n.pathway || '')}</p></div>`;
        }
      }

      document.querySelectorAll('.ml-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.ml-tab').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          current = btn.dataset.graph;
          selected = null;
          render();
        });
      });

      chart.on('click', p => {
        if (p.dataType === 'node' && p.data && p.data.raw) {
          selected = p.data;
          renderNode(selected);
        }
      });
      chart.getZr().on('click', e => {
        if (!e.target && selected) {
          selected = null;
          renderDefault(buildNodes(current));
        }
      });
      window.addEventListener('resize', () => chart.resize());
      document.getElementById('themeToggle')?.addEventListener('click', () => {
        setTimeout(render, 0);
      });

      render();
    })();
  </script>
</body>
</html>
